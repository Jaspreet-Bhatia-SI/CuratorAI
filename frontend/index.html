    <meta name="description" content="Generate personalized learning roadmaps and instantly download curated YouTube videos using the power of AI." />

    <meta property="og:type" content="website" />

    <script>
      (function() {
        var theme = localStorage.getItem('curator_theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
